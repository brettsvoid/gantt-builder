name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-web-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-web-

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --release

      - name: Package
        run: Compress-Archive -Path target/dx/gantt-builder/release/web/* -DestinationPath gantt-builder-web-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gantt-builder-web-windows
          path: gantt-builder-web-windows.zip

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: windows-desktop-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-desktop-

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --platform desktop --release

      - name: Package
        run: Compress-Archive -Path target/dx/gantt-builder/release/desktop/* -DestinationPath gantt-builder-desktop-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gantt-builder-desktop-windows
          path: gantt-builder-desktop-windows.zip

  build-desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: macos-desktop-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-desktop-

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --platform desktop --release

      - name: Package
        run: cd target/dx/gantt-builder/release/desktop && zip -r ../../../../../gantt-builder-desktop-macos.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gantt-builder-desktop-macos
          path: gantt-builder-desktop-macos.zip

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: linux-desktop-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-desktop-

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Build
        run: dx build --platform desktop --release

      - name: Package
        run: cd target/dx/gantt-builder/release/desktop && zip -r ../../../../../gantt-builder-desktop-linux.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gantt-builder-desktop-linux
          path: gantt-builder-desktop-linux.zip

  release:
    needs: [build-web-windows, build-desktop-windows, build-desktop-macos, build-desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
